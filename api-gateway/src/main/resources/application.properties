spring.application.name=api-gateway
server.port=9000

management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers

# ===================================================================
# 1. CIRCUIT BREAKER CONFIGURATION
# ===================================================================
# Bật endpoint health check trên Actuator
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
# Kích thước cửa sổ trượt (dựa trên 50 request gần nhất)
resilience4j.circuitbreaker.configs.default.slidingWindowSize=50
# Kiểu cửa sổ trượt: COUNT_BASED (số lượng) hoặc TIME_BASED (thời gian)
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
# Tỷ lệ thất bại tối thiểu (%) để chuyển sang trạng thái OPEN
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# Tỷ lệ request bị chậm (%) để tính là lỗi
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=100
# Ngưỡng thời gian (ms) được coi là request chậm
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=3000ms
# Số lượng request tối thiểu trong cửa sổ trượt để bắt đầu tính toán tỷ lệ lỗi
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=10
# Số request cho phép thử nghiệm khi ở trạng thái HALF_OPEN
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=10
# Thời gian chờ (ms) ở trạng thái OPEN trước khi chuyển sang HALF_OPEN
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000ms
# Tự động chuyển từ OPEN sang HALF_OPEN khi hết thời gian chờ
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

# ===================================================================
# 2. TIME LIMITER CONFIGURATION (Timeout)
# ===================================================================
# Thời gian chờ tối đa cho một request
resilience4j.timelimiter.configs.default.timeoutDuration=5s
# Hủy tác vụ đang chạy ngầm nếu quá thời gian timeout
resilience4j.timelimiter.configs.default.cancelRunningFuture=true

# ===================================================================
# 3. RETRY CONFIGURATION (Thử lại)
# ===================================================================
# Số lần thử lại tối đa (bao gồm cả lần gọi đầu tiên)
resilience4j.retry.configs.default.maxAttempts=3
# Khoảng thời gian chờ giữa các lần retry
resilience4j.retry.configs.default.waitDuration=2s
# Bật tính năng tăng dần thời gian chờ theo lũy thừa (Exponential Backoff)
resilience4j.retry.configs.default.enableExponentialBackoff=true
# Hệ số nhân thời gian chờ cho các lần retry tiếp theo
resilience4j.retry.configs.default.exponentialBackoffMultiplier=2

# ===================================================================
# 4. RATE LIMITER CONFIGURATION (Giới hạn tần suất)
# ===================================================================
# Thời gian tối đa thread chịu chờ để có được lượt gọi
resilience4j.ratelimiter.configs.default.timeoutDuration=1s
# Số lượt gọi tối đa trong một chu kỳ làm mới
resilience4j.ratelimiter.configs.default.limitForPeriod=100
# Thời gian làm mới lại số lượt gọi (Refresh Period)
resilience4j.ratelimiter.configs.default.limitRefreshPeriod=1s

# ===================================================================
# 5. BULKHEAD CONFIGURATION (Giới hạn luồng đồng thời)
# ===================================================================
# Số lượng request xử lý đồng thời tối đa
resilience4j.bulkhead.configs.default.maxConcurrentCalls=20
# Thời gian chờ tối đa nếu vượt quá số request đồng thời cho phép
resilience4j.bulkhead.configs.default.maxWaitDuration=20ms

# Keycloak
keycloak.auth.jwk-set-uri=http://localhost:8091/realms/het-security-realm/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8091/realms/het-security-realm

# Security
security.excluded.urls = /actuator/**