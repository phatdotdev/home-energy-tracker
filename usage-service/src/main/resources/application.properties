spring.application.name=usage-service
server.port=8083

#kafka - consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer


spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.phatdotdev.usage_service.kafka.event.EnergyUsageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*

#kafka - producer
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Influx DB Configuration
influx.url=http://localhost:8072
influx.token=my-token
influx.org=phatdotdev
influx.bucket=usage-bucket

device.service.url=http://localhost:8081/api/v1/device
user.service.url=http://localhost:8080/api/v1/user